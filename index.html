<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <title>My Todo App</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container">
    <h1 class="text-center">My Todo App</h1>
    <div class="bg-white rounded border-2 shadow-sm p-3">
      <h1>Title></h1>
      <form>
        <div class="mb-3">
          <label for="titleInput" class="form-label">Title</label>
          <input type="text" class="form-control" id="titleInput" aria-describedby="titleHelp">

        </div>
        <div class="mb-3">
          <label1 for="descriptionInput" class="small form-label">Description</label>
            <textarea="from-control" id="descriptionInput" rows="3"></textarea>
        </div>


        <div class="row mb-3">
          <div class="col">
            <label for="dueDateInput" class="form-label">Due Date</label>
            <input type="datetime-local" class="form-control" id="dueDateInput" />
            <div>
              <div class="col">
                <label for="assignInput" class="form-label">Assign to person(optional)</label>
                <select class="form-select" id="assignInput">
                  <option selected>--Select Person (Optional) --</option>
                  <option value="1">Person 1</option>
                  <option value="2">Person 2</option>

                </select>
                <div class="input-group">
                  <input class="form-control" type="file" id="attachmentInput" multiple />
                  <button class="btn btn-outline-secondary" type="btn-close"><svg xmlns="http://www.w3.org/2000/svg"
                      width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                      <path
                        d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
                    </svg></button>
                </div>
                <div class="border rounded p-3 mb-3" style="min-height: 60px;">
                  <!-- Attachment previews will go here later -->
                </div>
                <div class="d-flex justify-content-end">
                  <button type="submit" class="btn btn-primary">+ Add Todo</button>
                </div>
      </form>
      <div>
      </div>


      <div class="bg-white rounded border border-2 shadow-sm p-3 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 m-0">Todos</h2>
           <!-- Toolbar aligned to the right -->
      <div class="d-flex justify-content-end ">
        <div class="btn-group" role="group" aria-label="Filter and sort">
          <!-- Filter button -->
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnFilter">
            <i class="bi bi-funnel"></i>
          </button>

          <!-- Sort button -->
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSort">
            <i class="bi bi-sort-down"></i>
              </button>
          
        </div>
        
      </div>

    </div>
    <hr class="m-0 p-3">

        </div>
        <div>

</body>

</html>
